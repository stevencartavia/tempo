name: Release tempoup

permissions: {}

on:
  push:
    tags:
      - "tempoup-v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g., tempoup-v0.1.0)"
        required: true
        type: string
      dry_run:
        description: "Build artifacts without creating a release"
        default: false
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full

jobs:
  get-version:
    name: Get version
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve tag and version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          version=${tag#tempoup-v}
          if [ "tempoup-v$version" != "$tag" ]; then
            echo "Invalid tempoup tag: $tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  check-version:
    name: Check crate version
    needs: get-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Verify crate version
        env:
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          crate_version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tempoup").version')
          [ "$VERSION" = "$crate_version" ] || {
            echo "Tag version $VERSION does not match tempoup crate version $crate_version" >&2
            exit 1
          }

  build:
    name: Build ${{ matrix.platform.target }}
    needs: [get-version, check-version]
    environment: release
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: depot-ubuntu-latest-16
            target: x86_64-unknown-linux-gnu
          - os: depot-ubuntu-latest-arm-16
            target: aarch64-unknown-linux-gnu
          - os: depot-macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.platform.target }}
      - name: Build tempoup
        env:
          TARGET: ${{ matrix.platform.target }}
        run: cargo build --locked --bin tempoup --release --target "$TARGET"
      - name: Prepare artifact
        id: artifact
        shell: bash
        env:
          TAG: ${{ needs.get-version.outputs.tag }}
          TARGET: ${{ matrix.platform.target }}
        run: |
          binary_name="${TAG}-${TARGET}"
          archive_name="${binary_name}.tar.gz"
          cp "target/${TARGET}/release/tempoup" "$binary_name"
          tar czf "$archive_name" "$binary_name"
          shasum -a 256 "$archive_name" > "${archive_name}.sha256"
          shasum -a 256 "$binary_name" > "${binary_name}.sha256"
          {
            echo "binary_name=$binary_name"
            echo "archive_name=$archive_name"
          } >> "$GITHUB_OUTPUT"
      - name: Sign archive
        shell: bash
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          ARCHIVE_NAME: ${{ steps.artifact.outputs.archive_name }}
        run: |
          GNUPGHOME=$(mktemp -d)
          export GNUPGHOME
          echo -n "$GPG_SIGNING_KEY" | base64 --decode | gpg --batch --import
          printf '%s' "$GPG_PASSPHRASE" | gpg --passphrase-fd 0 --pinentry-mode loopback --batch -ab "$ARCHIVE_NAME"
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ${{ steps.artifact.outputs.archive_name }}
          format: spdx-json
          output-file: ${{ steps.artifact.outputs.archive_name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            ${{ steps.artifact.outputs.archive_name }}
            ${{ steps.artifact.outputs.binary_name }}
          sbom-path: ${{ steps.artifact.outputs.archive_name }}.spdx.json
      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: |
            ${{ steps.artifact.outputs.archive_name }}
            ${{ steps.artifact.outputs.binary_name }}
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93d77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tempoup-${{ matrix.platform.target }}
          path: |
            ${{ steps.artifact.outputs.binary_name }}
            ${{ steps.artifact.outputs.binary_name }}.sha256
            ${{ steps.artifact.outputs.archive_name }}
            ${{ steps.artifact.outputs.archive_name }}.sha256
            ${{ steps.artifact.outputs.archive_name }}.asc
            ${{ steps.artifact.outputs.archive_name }}.spdx.json
          if-no-files-found: error

  create-release:
    name: Create release
    needs: [get-version, build]
    if: ${{ github.event_name == 'push' || inputs.dry_run == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.get-version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "tempoup ${TAG#tempoup-v}" \
            --draft \
            --notes "" \
            artifacts/**/*
